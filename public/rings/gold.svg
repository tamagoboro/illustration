<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="goldBand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <radialGradient id="goldGem" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#fff7d6"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </radialGradient>
    <filter id="goldShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#b45309" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g filter="url(#goldShadow)">
    <circle cx="100" cy="100" r="90" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.9"/>
    <circle cx="100" cy="100" r="80" fill="none" stroke="url(#goldBand)" stroke-width="12"/>
    <circle cx="100" cy="100" r="70" fill="none" stroke="#fde68a" stroke-width="1" stroke-opacity="0.7"/>

    <!-- ダイヤ型の飾り x12 -->
    <g fill="url(#goldGem)" stroke="#b45309" stroke-width="0.6">
      <g transform="translate(100.00,16.00) rotate(0)"><polygon points="0,-9 4.5,0 0,9 -4.5,0"/></g>
      <g transform="translate(142.00,27.25) rotate(30)"><polygon points="0,-9 4.5,0 0,9 -4.5,0"/></g>
      <g transform="translate(172.75,58.00) rotate(60)"><polygon points="0,-9 4.5,0 0,9 -4.5,0"/></g>
      <g transform="translate(184.00,100.00) rotate(90)"><polygon points="0,-9 4.5,0 0,9 -4.5,0"/></g>
      <g transform="translate(172.75,142.00) rotate(120)"><polygon points="0,-9 4.5,0 0,9 -4.5,0"/></g>
      <g transform="translate(142.00,172.75) rotate(150)"><polygon points="0,-9 4.5,0 0,9 -4.5,0"/></g>
      <g transform="translate(100.00,184.00) rotate(180)"><polygon points="0,-9 4.5,0 0,9 -4.5,0"/></g>
      <g transform="translate(58.00,172.75) rotate(210)"><polygon points="0,-9 4.5,0 0,9 -4.5,0"/></g>
      <g transform="translate(27.25,142.00) rotate(240)"><polygon points="0,-9 4.5,0 0,9 -4.5,0"/></g>
      <g transform="translate(16.00,100.00) rotate(270)"><polygon points="0,-9 4.5,0 0,9 -4.5,0"/></g>
      <g transform="translate(27.25,58.00) rotate(300)"><polygon points="0,-9 4.5,0 0,9 -4.5,0"/></g>
      <g transform="translate(58.00,27.25) rotate(330)"><polygon points="0,-9 4.5,0 0,9 -4.5,0"/></g>
    </g>

    <!-- 王冠風の突起 x4（東西南北を強調） -->
    <g fill="url(#goldGem)" stroke="#b45309" stroke-width="0.6">
      <g transform="translate(100.00,16.00) rotate(0)"><path d="M0,-14 L5,1 L-5,1 Z"/></g>
      <g transform="translate(184.00,100.00) rotate(90)"><path d="M0,-14 L5,1 L-5,1 Z"/></g>
      <g transform="translate(100.00,184.00) rotate(180)"><path d="M0,-14 L5,1 L-5,1 Z"/></g>
      <g transform="translate(16.00,100.00) rotate(270)"><path d="M0,-14 L5,1 L-5,1 Z"/></g>
    </g>

    <!-- 外周の小さな粒 x12（ダイヤの間） -->
    <g fill="#fde68a" stroke="#f59e0b" stroke-width="0.5">
      <circle cx="124.33" cy="9.20" r="2.2"/>
      <circle cx="166.47" cy="33.53" r="2.2"/>
      <circle cx="190.80" cy="75.67" r="2.2"/>
      <circle cx="190.80" cy="124.33" r="2.2"/>
      <circle cx="166.47" cy="166.47" r="2.2"/>
      <circle cx="124.33" cy="190.80" r="2.2"/>
      <circle cx="75.67" cy="190.80" r="2.2"/>
      <circle cx="33.53" cy="166.47" r="2.2"/>
      <circle cx="9.20" cy="124.33" r="2.2"/>
      <circle cx="9.20" cy="75.67" r="2.2"/>
      <circle cx="33.53" cy="33.53" r="2.2"/>
      <circle cx="75.67" cy="9.20" r="2.2"/>
    </g>
  </g>
</svg>
